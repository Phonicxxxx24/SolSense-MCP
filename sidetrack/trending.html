<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solana Trending Programs — SolSense Sidetrack</title>
  <meta name="description" content="Real-time Solana trending programs dashboard. See which programs are getting the most activity on mainnet, powered by Helius." />
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #9945ff;
      --accent2: #14f195;
      --red: #f85149;
      --yellow: #e3b341;
      --radius: 12px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    h1 {
      font-size: clamp(22px, 5vw, 36px);
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 15px;
      margin-top: 6px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(153, 69, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(153, 69, 255, 0.3);
      margin-top: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      max-width: 820px;
      margin: 0 auto 24px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .form-group {
      flex: 1;
      min-width: 220px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: var(--accent);
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    button#fetchBtn {
      background: linear-gradient(135deg, var(--accent), #7b2fd6);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 26px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
      align-self: flex-end;
    }

    button#fetchBtn:hover { opacity: 0.88; }
    button#fetchBtn:active { transform: scale(0.97); }
    button#fetchBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      min-height: 24px;
      margin-bottom: 8px;
    }

    #status.error { color: var(--red); }
    #status.success { color: var(--accent2); }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(153,69,255,0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #resultsCard { display: none; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid rgba(48,54,61,0.5);
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }

    td { padding: 12px 14px; vertical-align: middle; }

    .rank {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-muted);
      width: 36px;
    }

    .rank.top1 { color: #ffd700; }
    .rank.top2 { color: #c0c0c0; }
    .rank.top3 { color: #cd7f32; }

    .program-id {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: var(--accent2);
      word-break: break-all;
    }

    .known-label {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 99px;
      background: rgba(20,241,149,0.12);
      color: var(--accent2);
      border: 1px solid rgba(20,241,149,0.25);
      margin-left: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      vertical-align: middle;
    }

    .count-bar-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .count-bar {
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      min-width: 4px;
      transition: width 0.4s ease;
    }

    .count-num {
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
      white-space: nowrap;
    }

    .sig-link {
      color: var(--accent);
      text-decoration: none;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      opacity: 0.85;
      transition: opacity 0.15s;
    }

    .sig-link:hover { opacity: 1; text-decoration: underline; }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .results-header h2 {
      font-size: 16px;
      font-weight: 700;
    }

    .meta-tag {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 10px;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 40px;
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      .form-row { flex-direction: column; }
      td:nth-child(4) { display: none; }
      thead th:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🔭</div>
    <h1>Solana Trending Programs</h1>
  </div>
  <p class="subtitle">Discover the most active programs on Solana mainnet, powered by Helius</p>
  <span class="badge">SolSense Sidetrack · Colosseum Frontier 2026</span>
</header>

<div class="card">
  <div class="form-row">
    <div class="form-group">
      <label for="apiKey">Helius API Key (Mainnet)</label>
      <input
        type="text"
        id="apiKey"
        placeholder="Paste your Helius API key…"
        autocomplete="off"
        spellcheck="false"
      />
    </div>
    <div class="form-group" style="max-width: 140px;">
      <label for="sampleSize">Sample Size</label>
      <input
        type="number"
        id="sampleSize"
        value="30"
        min="10"
        max="100"
      />
    </div>
    <button id="fetchBtn" onclick="fetchTrending()">⚡ Analyze</button>
  </div>
</div>

<div id="statusWrap">
  <p id="status"></p>
</div>

<div class="card" id="resultsCard">
  <div class="results-header">
    <h2>🏆 Top Programs by Activity</h2>
    <span class="meta-tag" id="metaTag"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Program</th>
          <th>Txns</th>
          <th>Example Signature</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<footer>
  <p>
    Built with <a href="https://helius.dev" target="_blank">Helius</a> ·
    Part of <a href="https://github.com/your-username/solsense-mcp" target="_blank">SolSense MCP</a> ·
    <a href="https://arena.colosseum.org/" target="_blank">Colosseum Frontier 2026</a>
  </p>
</footer>

<script>
  // Known program labels
  const KNOWN_PROGRAMS = {
    "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA": "SPL Token",
    "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb": "Token-2022",
    "11111111111111111111111111111111": "System Program",
    "ComputeBudget111111111111111111111111111111": "Compute Budget",
    "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJe8bXh": "ATA Program",
    "JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4": "Jupiter v6",
    "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc": "Orca Whirlpool",
    "9xQeWvG816bUx9EPjHmaT23yvVM2ZWbrrpZb9PusVFin": "Serum DEX v3",
    "mv3ekLzLbnVPNxjSKvqBpU3ZeZXPQdEC3bp5MDEBG68": "Marginfi",
    "So1endDq2YkqhipRh3WViPa8hdiSpxWy6z3Z6tMCpAo": "Solend",
    "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s": "Metaplex Token Metadata",
    "p1exdMJcjVao65QdewkaZRUnU6VPSXhus9n2GzWfh98": "Metaplex Auction",
  };

  function setStatus(msg, type = "") {
    const el = document.getElementById("status");
    el.innerHTML = msg;
    el.className = type;
  }

  async function rpc(url, method, params) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error.message);
    return json.result;
  }

  async function fetchTrending() {
    const apiKey = document.getElementById("apiKey").value.trim();
    const sampleSize = parseInt(document.getElementById("sampleSize").value, 10);

    if (!apiKey) {
      setStatus("⚠️  Please enter your Helius API key.", "error");
      return;
    }

    const btn = document.getElementById("fetchBtn");
    btn.disabled = true;
    document.getElementById("resultsCard").style.display = "none";
    setStatus('<span class="spinner"></span> Fetching recent transactions from mainnet…');

    const rpcUrl = `https://mainnet.helius-rpc.com/?api-key=${apiKey}`;

    try {
      // Step 1: Get recent slots and blocks to find recent txs
      // We use getSignaturesForAddress on the System Program as a proxy for global activity
      setStatus('<span class="spinner"></span> Sampling recent on-chain activity…');

      const signatures = await rpc(rpcUrl, "getSignaturesForAddress", [
        "11111111111111111111111111111111",
        { limit: Math.min(sampleSize, 100), commitment: "confirmed" },
      ]);

      if (!signatures || signatures.length === 0) {
        setStatus("No recent transactions found. Check your API key.", "error");
        btn.disabled = false;
        return;
      }

      setStatus(`<span class="spinner"></span> Analyzing ${signatures.length} transactions for program usage…`);

      // Step 2: Fetch transaction details in parallel (batches of 10)
      const sigList = signatures.map(s => s.signature);
      const programCounts = {};
      const programExamples = {};

      const BATCH = 10;
      for (let i = 0; i < sigList.length; i += BATCH) {
        const batch = sigList.slice(i, i + BATCH);
        const txDetails = await Promise.allSettled(
          batch.map(sig =>
            rpc(rpcUrl, "getTransaction", [
              sig,
              { encoding: "jsonParsed", maxSupportedTransactionVersion: 0 },
            ])
          )
        );

        for (let j = 0; j < txDetails.length; j++) {
          const result = txDetails[j];
          if (result.status !== "fulfilled" || !result.value) continue;
          const tx = result.value;
          const instructions = tx?.transaction?.message?.instructions ?? [];

          const seenPrograms = new Set();
          for (const ix of instructions) {
            const pid = ix.programId ?? ix.program;
            if (typeof pid !== "string") continue;
            if (seenPrograms.has(pid)) continue;
            seenPrograms.add(pid);
            programCounts[pid] = (programCounts[pid] || 0) + 1;
            if (!programExamples[pid]) programExamples[pid] = batch[j];
          }
        }

        setStatus(
          `<span class="spinner"></span> Processed ${Math.min(i + BATCH, sigList.length)} / ${sigList.length} transactions…`
        );
      }

      // Step 3: Sort and render top 10
      const sorted = Object.entries(programCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

      if (sorted.length === 0) {
        setStatus("Could not extract program data from the sampled transactions.", "error");
        btn.disabled = false;
        return;
      }

      const maxCount = sorted[0][1];
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      sorted.forEach(([pid, count], idx) => {
        const rankClass = idx === 0 ? "top1" : idx === 1 ? "top2" : idx === 2 ? "top3" : "";
        const rankIcon = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx + 1}`;
        const knownLabel = KNOWN_PROGRAMS[pid]
          ? `<span class="known-label">${KNOWN_PROGRAMS[pid]}</span>`
          : "";
        const exSig = programExamples[pid] || "";
        const exLink = exSig
          ? `<a class="sig-link" href="https://explorer.solana.com/tx/${exSig}" target="_blank">${exSig.slice(0, 20)}…</a>`
          : "<span style='color:var(--text-muted)'>—</span>";

        const barWidth = Math.round((count / maxCount) * 120);

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="rank ${rankClass}">${rankIcon}</span></td>
          <td>
            <div class="program-id">${pid}${knownLabel}</div>
          </td>
          <td>
            <div class="count-bar-wrap">
              <div class="count-bar" style="width:${barWidth}px"></div>
              <span class="count-num">${count}</span>
            </div>
          </td>
          <td>${exLink}</td>
        `;
        tbody.appendChild(tr);
      });

      const now = new Date().toLocaleTimeString();
      document.getElementById("metaTag").textContent = `${sigList.length} txns sampled · ${now}`;
      document.getElementById("resultsCard").style.display = "block";
      setStatus(`✅ Analysis complete — showing top ${sorted.length} programs by activity.`, "success");
    } catch (err) {
      setStatus(`❌ Error: ${err.message}`, "error");
    } finally {
      btn.disabled = false;
    }
  }

  // Allow pressing Enter in API key field
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("apiKey").addEventListener("keydown", (e) => {
      if (e.key === "Enter") fetchTrending();
    });
  });
</script>
</body>
</html>
